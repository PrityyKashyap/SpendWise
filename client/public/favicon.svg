<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>SpendWise</title>
  <!-- Geometry matches src/components/brand/Logo.jsx — keep the two in step.
       Scaled to fill the canvas: a favicon has no surrounding layout to breathe
       against, so padding only makes it smaller and harder to read at 16px. -->
  <defs>
    <linearGradient id="b" x1=".12" y1="0" x2=".88" y2="1">
      <stop offset="0" stop-color="#8E7CFF"/><stop offset="1" stop-color="#5533D6"/>
    </linearGradient>
    <linearGradient id="f" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#CFC7FF"/><stop offset="1" stop-color="#8064F2"/>
    </linearGradient>
  </defs>
  <g transform="translate(-2.4 -2.1) scale(1.109)">
    <g transform="rotate(-7 32 32)"><rect x="27" y="7" width="31" height="25" rx="11" fill="url(#f)"/></g>
    <rect x="4.5" y="16" width="45" height="41" rx="15" fill="url(#b)"/>
    <rect x="10" y="22.5" width="35" height="14" rx="7" fill="#FFFFFF"/>
    <rect x="34.5" y="36" width="22" height="15.5" rx="7.75" fill="url(#f)" stroke="#FFFFFF" stroke-width="2.8"/>
    <circle cx="45.5" cy="43.75" r="3.5" fill="#FFFFFF"/>
  </g>
</svg>
