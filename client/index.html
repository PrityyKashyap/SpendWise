<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach under the notch and home
         indicator; the safe-area insets in index.css keep content clear. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>SpendWise — Smarter Money Management</title>
    <meta
      name="description"
      content="Track expenses, manage budgets, analyze spending, and split expenses with SpendWise."
    />
    <!-- Tints the browser chrome and the iOS status bar to the app surface. -->
    <meta name="theme-color" content="#171B4D" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG for apple-touch-icon and falls back to a screenshot
         of the page, so this one must be a PNG. The web manifest is injected
         by vite-plugin-pwa at build time. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />

    <!-- Standalone mode on iOS, which has no web manifest support. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SpendWise" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph / Twitter: what a shared link looks like in a chat or feed.
         No og:image yet — pointing at an image that does not exist renders a
         broken preview, which is worse than the plain text card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SpendWise" />
    <meta property="og:title" content="SpendWise — Smarter Money Management" />
    <meta
      property="og:description"
      content="Track expenses, manage budgets, analyze spending, and split expenses with SpendWise."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SpendWise — Smarter Money Management" />
    <meta
      name="twitter:description"
      content="Track expenses, manage budgets, analyze spending, and split expenses with SpendWise."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
